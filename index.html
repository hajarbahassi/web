<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIYAD AUTO PRESTIGE | WOW Edition</title>

<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700;900&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
:root{
--red:#C8102E;
--gold:#B4975A;
--blue:#002349;
--dark:#0a0a0a;
}

*{box-sizing:border-box;transition:0.4s ease;}
body{
margin:0;
font-family:'Outfit',sans-serif;
background:white;
color:var(--blue);
overflow-x:hidden;
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 8%;
background:white;
position:sticky;
top:0;
z-index:1000;
border-bottom:1px solid #eee;
}

.logo{
font-family:'Bodoni Moda';
font-size:1.6rem;
font-weight:900;
}

.logo span{
color:var(--red);
display:block;
font-size:0.7rem;
letter-spacing:4px;
}

.hero{
height:90vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:white;
position:relative;
overflow:hidden;
}

.hero img{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
filter:brightness(0.6);
}

.hero h1{
font-family:'Bodoni Moda';
font-size:clamp(3rem,10vw,6rem);
z-index:2;
}

.container{
padding:80px 8%;
max-width:1400px;
margin:auto;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
gap:40px;
}

.card{
cursor:pointer;
}

.card-img{
height:450px;
overflow:hidden;
}

.card img{
width:100%;
height:100%;
object-fit:cover;
}

.card:hover img{
transform:scale(1.08);
}

.card-body{
padding:20px 0;
border-bottom:1px solid #eee;
}

.card-body h3{
margin:0;
font-family:'Bodoni Moda';
font-size:1.5rem;
}

.price{
color:var(--red);
font-weight:700;
margin-top:8px;
display:block;
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.6);
backdrop-filter:blur(10px);
align-items:center;
justify-content:center;
z-index:2000;
}

.modal-content{
background:rgba(255,255,255,0.9);
backdrop-filter:blur(20px);
padding:40px;
max-width:500px;
width:90%;
border-radius:20px;
animation:fade 0.5s ease;
}

@keyframes fade{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}

.form-group{
margin-bottom:20px;
}

.form-group label{
display:block;
font-weight:600;
margin-bottom:8px;
font-size:0.8rem;
text-transform:uppercase;
}

.form-group input{
width:100%;
padding:14px;
border:none;
border-bottom:2px solid #ddd;
font-size:1rem;
}

.form-group input:focus{
border-color:var(--red);
outline:none;
}

.total-box{
margin-top:20px;
padding:15px;
background:#f3f3f3;
border-radius:10px;
font-weight:700;
text-align:center;
}

.btn{
margin-top:25px;
width:100%;
padding:18px;
background:var(--blue);
color:white;
border:none;
font-weight:700;
letter-spacing:2px;
cursor:pointer;
}

.btn:hover{
background:var(--red);
}

.switch{
position:fixed;
bottom:40px;
right:40px;
width:70px;
height:70px;
background:var(--gold);
color:white;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
cursor:pointer;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

#vintage-ui{
display:none;
background:var(--dark);
color:white;
}

</style>
</head>
<body>

<div style="display:none">
<div id="jazz-player"></div>
<audio id="vintage-music" loop>
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>
</div>

<div id="modern-ui">
<nav>
<div class="logo">RIYAD AUTO<span>PRESTIGE</span></div>
<div onclick="toggleUniverse()" style="cursor:pointer;font-weight:700;">COLLECTION HÉRITAGE</div>
</nav>

<section class="hero">
<img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1920">
<h1>L'ÉLITE À RABAT</h1>
</section>

<div class="container">
<div class="grid">

<div class="card" onclick="openModal('Skoda Octavia 2024',500)">
<div class="card-img">
<img src="https://images.unsplash.com/photo-1606152424102-0caee462ca2a?auto=format&fit=crop&w=800">
</div>
<div class="card-body">
<h3>Skoda Octavia 2024</h3>
<span class="price">500 DH / Jour</span>
</div>
</div>

<div class="card" onclick="openModal('BMW M-Sport Luxe',900)">
<div class="card-img">
<img src="https://images.unsplash.com/photo-1555215695-3004980ad54e?auto=format&fit=crop&w=800">
</div>
<div class="card-body">
<h3>BMW M-Sport Luxe</h3>
<span class="price">900 DH / Jour</span>
</div>
</div>

</div>
</div>
</div>

<div id="vintage-ui">
<nav>
<div class="logo" style="color:white;">RIYAD AUTO<span style="color:var(--gold)">PRESTIGE</span></div>
<div onclick="toggleUniverse()" style="cursor:pointer;font-weight:700;">RETOUR MODERNE</div>
</nav>

<section class="hero">
<img src="https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?auto=format&fit=crop&w=1920">
<h1 style="color:var(--gold)">HÉRITAGE</h1>
</section>
</div>

<div class="modal" id="modal">
<div class="modal-content">
<h2 id="carName"></h2>

<div class="form-group">
<label>Votre Nom</label>
<input type="text" id="clientName">
</div>

<div class="form-group">
<label>Date Début</label>
<input type="date" id="startDate" onchange="calculateTotal()">
</div>

<div class="form-group">
<label>Date Fin</label>
<input type="date" id="endDate" onchange="calculateTotal()">
</div>

<div class="total-box" id="totalBox">Total : 0 DH</div>

<button class="btn" onclick="sendWhatsApp()">CONFIRMER SUR WHATSAPP</button>
</div>
</div>

<div class="switch" onclick="toggleUniverse()">
<i class="fas fa-sync"></i>
</div>

<script>
let selectedCar="";
let pricePerDay=0;
let isVintage=false;
let jazzPlayer;

var tag=document.createElement('script');
tag.src="https://www.youtube.com/iframe_api";
document.body.appendChild(tag);

function onYouTubeIframeAPIReady(){
jazzPlayer=new YT.Player('jazz-player',{
height:'0',
width:'0',
videoId:'Dx5qFachd3A',
playerVars:{autoplay:1,loop:1,playlist:'Dx5qFachd3A'},
events:{onReady:(e)=>e.target.playVideo()}
});
}

function toggleUniverse(){
isVintage=!isVintage;
const modern=document.getElementById("modern-ui");
const vintage=document.getElementById("vintage-ui");
const vMusic=document.getElementById("vintage-music");

if(isVintage){
modern.style.display="none";
vintage.style.display="block";
if(jazzPlayer)jazzPlayer.pauseVideo();
vMusic.play();
}else{
modern.style.display="block";
vintage.style.display="none";
vMusic.pause();
if(jazzPlayer)jazzPlayer.playVideo();
}
window.scrollTo(0,0);
}

function openModal(car,price){
selectedCar=car;
pricePerDay=price;
document.getElementById("carName").innerText=car;
document.getElementById("modal").style.display="flex";
}

function calculateTotal(){
const start=new Date(document.getElementById("startDate").value);
const end=new Date(document.getElementById("endDate").value);
if(start && end && end>start){
const days=(end-start)/(1000*60*60*24);
const total=days*pricePerDay;
document.getElementById("totalBox").innerText="Total : "+total+" DH ("+days+" jours)";
}
}

function sendWhatsApp(){
const name=document.getElementById("clientName").value;
const start=document.getElementById("startDate").value;
const end=document.getElementById("endDate").value;
const total=document.getElementById("totalBox").innerText;

if(!name||!start||!end){alert("Veuillez remplir tous les champs");return;}

const msg=`Bonjour Riyad Auto Prestige, je suis ${name}. Je souhaite réserver la ${selectedCar} du ${start} au ${end}. ${total}`;
window.open(`https://wa.me/212628875855?text=${encodeURIComponent(msg)}`,'_blank');
}
</script>

</body>
</html>
